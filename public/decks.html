<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Decks - MageVault</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header>
        <a href="/" class="logo">MageVault</a>
        <nav>
            <ul>
                <li><a href="/">Início</a></li>
                <li><a href="/collection.html">Coleção</a></li>
                <li><a href="/decks.html" class="active">Decks</a></li>
                <li><a href="/deck-builder.html" class="btn" style="color:white">Novo Deck</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="flex-between">
            <h1>Meus Decks</h1>
            <a href="/deck-builder.html" class="btn">Criar Novo Deck</a>
        </div>

        <div class="glass-panel mt-4">
            <div id="decks-list" class="deck-list">
                <!-- Decks will be listed here -->
                <p style="color: var(--text-muted)">Carregando decks...</p>
            </div>
        </div>
    </main>

    <!-- Modals -->
    <div id="edit-deck-modal" class="modal-backdrop" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center;">
        <div class="glass-panel" style="width: 90%; max-width: 700px; max-height: 90vh; overflow-y: auto; position: relative;">
            <h2>Editar Deck</h2>
            <div class="form-group">
                <label>Nome do Deck</label>
                <input type="text" id="edit-deck-name" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.3); color: white;">
            </div>
            <div class="form-group">
                <label>Escolher Capa (Clique na carta)</label>
                <div id="cover-card-grid" class="card-grid" style="max-height: 400px; overflow-y: auto;">
                    <p style="color: var(--text-muted);">Carregando cartas...</p>
                </div>
            </div>
            <div class="flex-row" style="justify-content: flex-end; margin-top: 1rem;">
                <button class="btn btn-secondary" id="btn-cancel-edit">Cancelar</button>
                <button class="btn btn-success" id="btn-save-edit">Salvar</button>
            </div>
        </div>
    </div>

    <div id="delete-deck-modal" class="modal-backdrop" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center;">
        <div class="glass-panel" style="width: 90%; max-width: 400px;">
            <h2>Deletar Deck</h2>
            <p>Tem certeza que deseja deletar o deck <strong id="delete-deck-name"></strong>?</p>
            <div class="flex-row" style="justify-content: flex-end; margin-top: 1rem;">
                <button class="btn btn-secondary" id="btn-cancel-delete">Cancelar</button>
                <button class="btn btn-danger" id="btn-confirm-delete">Deletar</button>
            </div>
        </div>
    </div>

    <div id="export-deck-modal" class="modal-backdrop" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center;">
        <div class="glass-panel" style="width: 90%; max-width: 500px;">
            <h2>Exportar Deck</h2>
            <textarea id="export-deck-text" rows="12" style="width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--primary-color); color: white; padding: 1rem; border-radius: 8px; resize: vertical;" readonly></textarea>
            <div class="flex-row" style="justify-content: flex-end; margin-top: 1rem;">
                <button class="btn btn-secondary" id="btn-close-export">Fechar</button>
                <button class="btn" id="btn-copy-export">Copiar Lista</button>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.app && window.app.initDecksList) {
                window.app.initDecksList();
            }
        });
    </script>
</body>
</html>
